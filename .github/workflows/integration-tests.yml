name: MLflow Runtime Integration Tests

# This workflow owns push, pull request, and manual MLflow runtime validation.
# The scheduled ODH default-image alignment check lives in verify-mlflow-version-alignment.yml.
#
# Sync note: the base integration-test matrix lives in mlflow-tests/ci/integration-matrix.json
# and is also consumed by opendatahub-io/mlflow .github/workflows/operator-integration-tests.yml.
# This workflow adds operator-PR-only file and S3 artifact-server rows until the companion workflow
# forwards that mode. Keep the remaining env vars, action versions, and script calls in sync.

env:
  NAMESPACE: opendatahub
  INTEGRATION_CLUSTER_NAME: mlflow
  PYTEST_ARGS: "-v --tb=short --strict-markers --disable-warnings"
  AWS_ACCESS_KEY_ID: minio
  AWS_SECRET_ACCESS_KEY: minio123
  AWS_S3_BUCKET: mlpipeline
  MLFLOW_RUNTIME_ARTIFACT: mlflow-runtime-image
  MLFLOW_RUNTIME_IMAGE: localhost/mlflow-runtime:ci
  MLFLOW_TESTS_RUNTIME_ARTIFACT: mlflow-tests-image
  MLFLOW_TESTS_RUNTIME_IMAGE: localhost/mlflow-tests:ci
  OPERATOR_RUNTIME_ARTIFACT: mlflow-operator-image
  OPERATOR_RUNTIME_IMAGE: localhost/mlflow-operator:ci
  IS_RHDS_REPOSITORY: ${{ github.repository_owner == 'red-hat-data-services' }}
  IS_CROSS_REPOSITORY_PR: >-
    ${{ github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name != github.repository }}

on:
  workflow_call:
    inputs:
      mlflow_repository:
        description: "Repository to build MLflow image from (e.g., opendatahub-io/mlflow)"
        type: string
        required: false
        default: ""
      mlflow_ref:
        description: "Git ref to checkout for MLflow build (e.g., refs/pull/42/merge)"
        type: string
        required: false
        default: ""

  push:
    branches:
      - main

  pull_request:

defaults:
  run:
    shell: bash

jobs:
  load-ci-config:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ inputs.mlflow_repository && format('{0}/mlflow-operator', github.repository_owner) || github.repository }}
          sparse-checkout: mlflow-tests/ci
          persist-credentials: false

      - name: Load integration test matrix
        id: matrix
        run: |
          matrix="$(jq -c '
            # The false axis makes the true include additive; without it GitHub merges the
            # include into the existing PostgreSQL/S3/serve=false row and drops that coverage.
            .artifacts_server = ["false"] |
            .include += [
              {
                "k8s_version": "v1.34.0",
                "backend_store": "postgres",
                "artifact_backends": "file",
                "serve_artifacts": "false",
                "registry_store": "postgres",
                "artifacts_server": "true",
                "pytest_mark_expression": "smoke and artifacts_server"
              },
              {
                "k8s_version": "v1.34.0",
                "backend_store": "postgres",
                "artifact_backends": "s3",
                "serve_artifacts": "false",
                "registry_store": "postgres",
                "artifacts_server": "true",
                "pytest_mark_expression": "smoke and artifacts_server"
              }
            ]
          ' mlflow-tests/ci/integration-matrix.json)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-mlflow-runtime-image:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      source_repository: ${{ steps.configure.outputs.source_repository }}
      source_ref: ${{ steps.configure.outputs.source_ref }}
    steps:
      - name: Checkout operator repository for runtime wrapper tests
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ inputs.mlflow_repository && format('{0}/mlflow-operator', github.repository_owner) || github.repository }}
          path: operator-source
          persist-credentials: false

      - name: Resolve MLflow source build settings
        id: configure
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          TARGET_REF: ${{ github.base_ref || github.ref_name }}
          MLFLOW_REPOSITORY: ${{ inputs.mlflow_repository }}
          MLFLOW_REF: ${{ inputs.mlflow_ref }}
        run: |
          if [[ -n "$MLFLOW_REPOSITORY" && -n "$MLFLOW_REF" ]]; then
            SOURCE_REPOSITORY="$MLFLOW_REPOSITORY"
            SOURCE_REF="$MLFLOW_REF"
          else
            if [[ "$REPOSITORY_OWNER" == "red-hat-data-services" ]]; then
              SOURCE_REPOSITORY="red-hat-data-services/mlflow"
            else
              SOURCE_REPOSITORY="opendatahub-io/mlflow"
            fi

            if [[ "$REPOSITORY_OWNER" == "opendatahub-io" && "$TARGET_REF" == "main" ]]; then
              SOURCE_REF="master"
            else
              SOURCE_REF="$TARGET_REF"
            fi
          fi

          echo "source_repository=$SOURCE_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "source_ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"

      - name: Checkout MLflow source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ steps.configure.outputs.source_repository }}
          ref: ${{ steps.configure.outputs.source_ref }}
          path: mlflow-upstream
          persist-credentials: false

      - name: Resolve MLflow Dockerfile
        id: dockerfile
        run: |
          if [[ -f mlflow-upstream/Dockerfile.konflux ]]; then
            echo "path=mlflow-upstream/Dockerfile.konflux" >> "$GITHUB_OUTPUT"
          else
            echo "path=mlflow-upstream/Dockerfile" >> "$GITHUB_OUTPUT"
          fi

      # Trusted RHDS runs use the checked-out default after login.
      # Cross-repository PRs targeting RHDS use ODH's public base image.
      #
      # NOTE: mlflow's resolve-base-image action is used here,
      # although both mlflow and mlflow-operator define this action.
      - name: Resolve public base image
        id: public-base-image
        if: env.IS_RHDS_REPOSITORY == 'true' && env.IS_CROSS_REPOSITORY_PR == 'true'
        uses: ./mlflow-upstream/.github/actions/resolve-base-image
        with:
          repository: opendatahub-io/mlflow
          ref: master
          dockerfile: Dockerfile.konflux
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Red Hat registry
        if: env.IS_RHDS_REPOSITORY == 'true' && env.IS_CROSS_REPOSITORY_PR != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: registry.redhat.io
          username: ${{ secrets.RH_REGISTRY_USERNAME }}
          password: ${{ secrets.RH_REGISTRY_PASSWORD }}

      - name: Build MLflow image archive
        env:
          DOCKERFILE: ${{ steps.dockerfile.outputs.path }}
          PUBLIC_BASE_IMAGE: ${{ steps.public-base-image.outputs.base_image }}
          PUBLIC_SOURCE: ${{ steps.public-base-image.outputs.source }}
        run: |
          mkdir -p runtime-image
          if [[ -n "$PUBLIC_BASE_IMAGE" ]]; then
            echo "Overriding BASE_IMAGE with $PUBLIC_BASE_IMAGE"
            echo "Source: $PUBLIC_SOURCE (canonical fallback)"
            docker build --build-arg "BASE_IMAGE=$PUBLIC_BASE_IMAGE" \
              -f "$DOCKERFILE" -t "$MLFLOW_RUNTIME_IMAGE" mlflow-upstream
          else
            docker build -f "$DOCKERFILE" -t "$MLFLOW_RUNTIME_IMAGE" mlflow-upstream
          fi
          docker save -o "runtime-image/${MLFLOW_RUNTIME_ARTIFACT}.tar" "$MLFLOW_RUNTIME_IMAGE"

      - name: Test SQL trace rollup wrapper against built MLflow runtime
        run: >-
          docker run --rm
          --entrypoint python3.12
          -v "$GITHUB_WORKSPACE/operator-source:/operator:ro"
          -w /operator
          "$MLFLOW_RUNTIME_IMAGE"
          -B -m unittest test/scripts/test_trace_rollups_script.py

      - name: Upload MLflow image artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ env.MLFLOW_RUNTIME_ARTIFACT }}
          path: runtime-image/${{ env.MLFLOW_RUNTIME_ARTIFACT }}.tar
          retention-days: 1
          if-no-files-found: error

  build-mlflow-operator-image:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout operator repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ inputs.mlflow_repository && format('{0}/mlflow-operator', github.repository_owner) || github.repository }}
          persist-credentials: false

      - name: Resolve operator Dockerfile
        id: dockerfile
        run: |
          if [[ -f Dockerfile.konflux ]]; then
            echo "path=Dockerfile.konflux" >> "$GITHUB_OUTPUT"
          else
            echo "path=Dockerfile" >> "$GITHUB_OUTPUT"
          fi

      # NOTE: mlflow-operator's resolve-base-image action is used here,
      # although both mlflow and mlflow-operator define this action.
      - name: Resolve public base image
        id: public-base-image
        if: env.IS_RHDS_REPOSITORY == 'true' && env.IS_CROSS_REPOSITORY_PR == 'true'
        uses: ./.github/actions/resolve-base-image
        with:
          repository: opendatahub-io/mlflow-operator
          ref: main
          dockerfile: Dockerfile
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Red Hat registry
        if: env.IS_RHDS_REPOSITORY == 'true' && env.IS_CROSS_REPOSITORY_PR != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: registry.redhat.io
          username: ${{ secrets.RH_REGISTRY_USERNAME }}
          password: ${{ secrets.RH_REGISTRY_PASSWORD }}

      - name: Build MLflow operator image archive
        env:
          DOCKERFILE: ${{ steps.dockerfile.outputs.path }}
          PUBLIC_BASE_IMAGE: ${{ steps.public-base-image.outputs.base_image }}
          PUBLIC_SOURCE: ${{ steps.public-base-image.outputs.source }}
        run: |
          mkdir -p operator-image
          if [[ -n "$PUBLIC_BASE_IMAGE" ]]; then
            echo "Overriding BASE_IMAGE with $PUBLIC_BASE_IMAGE"
            echo "Source: $PUBLIC_SOURCE (canonical fallback)"
            docker build --build-arg "BASE_IMAGE=$PUBLIC_BASE_IMAGE" \
              -f "$DOCKERFILE" -t "$OPERATOR_RUNTIME_IMAGE" .
          else
            docker build -f "$DOCKERFILE" -t "$OPERATOR_RUNTIME_IMAGE" .
          fi
          docker save -o "operator-image/${OPERATOR_RUNTIME_ARTIFACT}.tar" "$OPERATOR_RUNTIME_IMAGE"

      - name: Upload MLflow operator image artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ env.OPERATOR_RUNTIME_ARTIFACT }}
          path: operator-image/${{ env.OPERATOR_RUNTIME_ARTIFACT }}.tar
          retention-days: 1
          if-no-files-found: error

  build-mlflow-tests-image:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout operator repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ inputs.mlflow_repository && format('{0}/mlflow-operator', github.repository_owner) || github.repository }}
          persist-credentials: false

      - name: Build MLflow tests image archive
        run: |
          mkdir -p test-image
          docker build -f mlflow-tests/images/Dockerfile.konflux -t "$MLFLOW_TESTS_RUNTIME_IMAGE" .
          docker save -o "test-image/${MLFLOW_TESTS_RUNTIME_ARTIFACT}.tar" "$MLFLOW_TESTS_RUNTIME_IMAGE"

      - name: Upload MLflow tests image artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ env.MLFLOW_TESTS_RUNTIME_ARTIFACT }}
          path: test-image/${{ env.MLFLOW_TESTS_RUNTIME_ARTIFACT }}.tar
          retention-days: 1
          if-no-files-found: error

  integration-tests:
    needs:
      [
        load-ci-config,
        build-mlflow-runtime-image,
        build-mlflow-operator-image,
        build-mlflow-tests-image,
      ]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix: ${{ fromJSON(needs.load-ci-config.outputs.matrix) }}
      fail-fast: false
    name: Integration tests - K8s=${{ matrix.k8s_version }} artifacts=${{ matrix.artifact_backends }} backend=${{ matrix.backend_store }} registry=${{ matrix.registry_store }} artifacts-server=${{ matrix.artifacts_server || 'false' }}

    steps:
      - name: Checkout operator repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ inputs.mlflow_repository && format('{0}/mlflow-operator', github.repository_owner) || github.repository }}
          persist-credentials: false

      - name: Free up disk space
        run: |
          sudo apt-get remove -y --purge 'liblldb-*' || true
          sudo apt-get autoremove -y || true
          docker system prune -af || true

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          version: v0.29.0
          node_image: kindest/node:${{ matrix.k8s_version }}
          cluster_name: ${{ env.INTEGRATION_CLUSTER_NAME }}
          registry: "true"

      - name: Download MLflow operator image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.OPERATOR_RUNTIME_ARTIFACT }}
          path: operator-image

      - name: Load MLflow operator image into Kind cluster
        run: |
          docker load -i "operator-image/${OPERATOR_RUNTIME_ARTIFACT}.tar"
          kind load docker-image "$OPERATOR_RUNTIME_IMAGE" --name "$INTEGRATION_CLUSTER_NAME"

      - name: Download MLflow runtime image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.MLFLOW_RUNTIME_ARTIFACT }}
          path: runtime-image

      - name: Load MLflow runtime image into Kind cluster
        run: |
          docker load -i "runtime-image/${MLFLOW_RUNTIME_ARTIFACT}.tar"
          kind load docker-image "$MLFLOW_RUNTIME_IMAGE" --name "$INTEGRATION_CLUSTER_NAME"

      - name: Download MLflow tests image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.MLFLOW_TESTS_RUNTIME_ARTIFACT }}
          path: test-image

      - name: Load MLflow tests image
        run: docker load -i "test-image/${MLFLOW_TESTS_RUNTIME_ARTIFACT}.tar"

      - name: Run integration tests
        id: run-tests
        continue-on-error: true
        env:
          ARTIFACT_BACKENDS: ${{ matrix.artifact_backends }}
          BACKEND_STORE: ${{ matrix.backend_store }}
          REGISTRY_STORE: ${{ matrix.registry_store }}
          SERVE_ARTIFACTS: ${{ matrix.serve_artifacts }}
          ARTIFACTS_SERVER: ${{ matrix.artifacts_server || 'false' }}
          POSTGRES_TLS: ${{ matrix.postgres_tls || 'false' }}
          SEAWEEDFS_TLS: ${{ matrix.seaweedfs_tls || 'false' }}
          WORKSPACE_LABEL_SELECTOR: ${{ matrix.workspace_label_selector || '' }}
          TEST_RESULTS_DIR: test-results
          PYTEST_MARK_EXPRESSION: ${{ matrix.pytest_mark_expression || '' }}
        run: mlflow-tests/images/run-integration-tests.sh

      - name: Upload test results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: "!cancelled()"
        with:
          name: integration-test-results-${{ matrix.k8s_version }}-${{ matrix.backend_store }}-${{ matrix.registry_store }}-${{ matrix.artifact_backends }}-${{ matrix.serve_artifacts }}-artifacts_server_${{ matrix.artifacts_server || 'false' }}-postgres_tls_${{ matrix.postgres_tls || 'false' }}-seaweedfs_tls_${{ matrix.seaweedfs_tls || 'false' }}
          path: test-results/
          retention-days: 30
          if-no-files-found: warn

      - name: Collect debug logs
        if: failure() && !cancelled()
        continue-on-error: true
        run: |
          mlflow-tests/images/collect-debug-logs.sh \
            --namespace "$NAMESPACE" \
            --output-dir debug-logs

      - name: Upload debug logs
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: failure() && !cancelled()
        with:
          name: debug-logs-${{ matrix.k8s_version }}-${{ matrix.backend_store }}-${{ matrix.registry_store }}-${{ matrix.artifact_backends }}-${{ matrix.serve_artifacts }}-artifacts_server_${{ matrix.artifacts_server || 'false' }}-postgres_tls_${{ matrix.postgres_tls || 'false' }}-seaweedfs_tls_${{ matrix.seaweedfs_tls || 'false' }}
          path: debug-logs/
          retention-days: 7
          if-no-files-found: warn

      - name: Mark workflow failure if tests failed
        if: steps.run-tests.outcome != 'success' && !cancelled()
        run: exit 1

  verify-built-mlflow-version-alignment:
    if: "!inputs.mlflow_repository && github.event_name != 'workflow_dispatch' && github.repository_owner == 'red-hat-data-services'"
    needs: build-mlflow-runtime-image
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download MLflow runtime image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.MLFLOW_RUNTIME_ARTIFACT }}
          path: runtime-image

      - name: Load built MLflow image
        run: docker load -i "runtime-image/${MLFLOW_RUNTIME_ARTIFACT}.tar"

      - name: Verify built MLflow image version alignment
        run: |
          python3 test/scripts/verify_mlflow_version_alignment.py \
            --mlflow-image "$MLFLOW_RUNTIME_IMAGE"

  verify-default-mlflow-version-alignment:
    if: "!inputs.mlflow_repository && github.event_name != 'workflow_dispatch' && github.repository_owner == 'opendatahub-io' && (github.ref_name == 'main' || github.base_ref == 'main')"
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify default MLflow image version alignment
        run: |
          python3 test/scripts/verify_mlflow_version_alignment.py \
            --params-env config/base/params.env \
            --params-env .github/test-infra/overlays/kind/params.env
