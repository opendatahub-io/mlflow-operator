{{- if eq (include "mlflow.traceRollupsEnabled" .) "true" }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mlflow-trace-rollups{{ .Values.resourceSuffix }}
  namespace: {{ .Values.namespace }}
  labels:
    app: mlflow-trace-rollups{{ .Values.resourceSuffix }}
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  schedule: {{ .Values.traceRollups.schedule | quote }}
  timeZone: {{ .Values.traceRollups.timeZone | quote }}
  suspend: false
  startingDeadlineSeconds: 3600
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        mlflow.opendatahub.io/trace-rollups-instance: mlflow{{ .Values.resourceSuffix }}
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: mlflow-trace-rollups{{ .Values.resourceSuffix }}
            app.kubernetes.io/instance: mlflow{{ .Values.resourceSuffix }}
            {{- with .Values.commonLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        spec:
          serviceAccountName: {{ .Values.serviceAccount.name }}
          automountServiceAccountToken: false
          restartPolicy: Never
          {{- with .Values.podSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: {{ .Values.temporaryStorage.sizeLimit }}
            {{- include "mlflow.caBundleVolumes" . | nindent 12 }}
          {{- include "mlflow.caBundleInitContainers" . | nindent 10 }}
          containers:
            - name: mlflow-trace-rollups
              image: {{ .Values.image.name }}
              {{- if .Values.image.imagePullPolicy }}
              imagePullPolicy: {{ .Values.image.imagePullPolicy }}
              {{- end }}
              command:
                - python3.12
                - -c
                - |
                  {{- .Files.Get "scripts/trace_rollups.py" | nindent 18 }}
              env:
                {{- if ne (include "mlflow.hasRollupsEnvOverride" .) "true" }}
                - name: MLFLOW_SQL_TRACE_ROLLUPS_ENABLED
                  value: "true"
                {{- end }}
                - name: MLFLOW_DISABLE_TELEMETRY
                  value: "true"
                - name: MLFLOW_BACKEND_STORE_URI
                  {{- if .Values.mlflow.backendStoreUriFrom }}
                  valueFrom:
                    {{- toYaml .Values.mlflow.backendStoreUriFrom | nindent 20 }}
                  {{- else }}
                  value: {{ .Values.mlflow.backendStoreUri | quote }}
                  {{- end }}
                {{- include "mlflow.caBundleEnv" . | nindent 16 }}
                {{- range .Values.env }}
                {{- if ne .name "MLFLOW_BACKEND_STORE_URI" }}
                - name: {{ .name }}
                  {{- if .valueFrom }}
                  valueFrom:
                    {{- toYaml .valueFrom | nindent 20 }}
                  {{- else }}
                  value: {{ .value | quote }}
                  {{- end }}
                {{- end }}
                {{- end }}
              {{- if .Values.envFrom }}
              envFrom:
                {{- toYaml .Values.envFrom | nindent 16 }}
              {{- end }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                {{- if .Values.caBundle.configMaps }}
                - name: combined-ca-bundle
                  mountPath: {{ dir .Values.caBundle.outputPath }}
                  readOnly: true
                {{- end }}
              {{- with .Values.securityContext }}
              securityContext:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- with .Values.traceRollups.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
{{- end }}
